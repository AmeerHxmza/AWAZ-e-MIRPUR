name: Keep Render Backend Alive

on:
  schedule:
    # Run every 14 minutes: cron syntax runs periodically
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health POST API
        run: |
          BACKEND_URL="${{ secrets.BACKEND_API_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_API_URL secret is not set. Please add it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # Strip trailing slash if any
          BACKEND_URL="${BACKEND_URL%/}"
          echo "Pinging ${BACKEND_URL}/health via POST..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${BACKEND_URL}/health")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | tr -d '\r' | awk -F: '/HTTP_STATUS/{print $2}')
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Backend is alive! HTTP $STATUS"
          else
            echo "Health check failed with status $STATUS"
            exit 1
          fi
